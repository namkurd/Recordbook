name: Update records
on:
  schedule:
    # Tuesday, after the Rumble Central / lifetime-record repos have refreshed (they run 07:17-10:17 UTC). Cron is UTC and best-effort.
    - cron: "40 11 * * 2"
    - cron: "40 14 * * 2"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record-book
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Read each season's league format (era) from Sleeper
        run: python tools/build_eras.py
        continue-on-error: true
      - name: Recompute records
        run: python engine/run.py
      - name: Commit if anything changed
        run: |
          git config user.name "record-book[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/records.json data/changelog.jsonl data/cache data/eras.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "record book: weekly update"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
